name: Checagem e Alerta EV+
on:
  schedule:
    # A cada 15 min, das 12h às 03h UTC = ~09h às ~24h horário de Brasília (UTC-3).
    - cron: '*/15 12-23,0-2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python src/main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BETFAIR_COMMISSION: ${{ secrets.BETFAIR_COMMISSION }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza estado de alertas [skip ci]"
          file_pattern: "data/alertas.db"
