name: Descoberta de Jogos do Dia
on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 horário de Brasília
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  descobrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python src/descoberta_jogos.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: descoberta de jogos do dia [skip ci]"
          file_pattern: "data/alertas.db"
